# Plan 0009 D1: the same check as on the owner's PC, on every pull request and push to main.
# The release key never comes here: the APK is debug-signed, which still proves no INTERNET and no cloud backup.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The checkout is on D:. With the pub cache on C:, Kotlin's incremental compile of plugins fails
      # ("this and base files have different roots"), so keep both on one drive.
      PUB_CACHE: D:\pub-cache
      # No Gradle or Kotlin daemon stays after the build: a daemon holds the lock files in ~/.gradle, and the cache step
      # then cannot read them and saves nothing (PR #134).
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Build only when something check.ps1 reads changed: the app, the packages (game rules and data/*.json), the
      # scripts, the gate hook its test cases run, this workflow, .gitattributes (line endings decide the format
      # check), or the release notes (the app shows them, and its tests check their format: spec 0018). Docs, design
      # images, intent/specs/plans, evals and incidents pass in a minute.
      # A diff that can't be read builds as before. A new code folder must be added to this list.
      # On a pull request, HEAD is the merge with today's main, and its first parent is today's main. GitHub's
      # base.sha can be an older main, and a diff from it also shows main's newer changes (PR #48).
      - name: What changed
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base=$(git rev-parse HEAD^1) || base=""; else base=${{ github.event.before }}; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          code='^(app/|packages/|scripts/|releases/|\.github/|\.claude/hooks/production-gate\.ps1$|\.gitattributes$)'
          if files=$(git diff --name-only "$base" HEAD) && [ -n "$files" ] && ! echo "$files" | grep -qE "$code"; then
            echo "No code changed; skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      # A draft intent, spec or plan never reaches main (CONTRIBUTING.md): Zkalf accepts it on the pull request, and
      # its Status line says accepted before the merge. Runs even when the build is skipped. A diff that can't be read
      # checks every file.
      - name: No drafts
        shell: bash
        run: |
          base=${{ steps.scope.outputs.base }}
          files=$(git diff --name-only "$base" HEAD) || files=$(git ls-files intent specs plans)
          drafts=""
          for f in $files; do
            case "$f" in intent/[0-9][0-9][0-9][0-9]-*.md|specs/[0-9][0-9][0-9][0-9]-*.md|plans/[0-9][0-9][0-9][0-9]-*.md) ;; *) continue ;; esac
            if [ -f "$f" ] && grep -qiE '^Status:[[:space:]]*draft' "$f"; then drafts="$drafts $f"; fi
          done
          if [ -n "$drafts" ]; then
            echo "::error::Still a draft:$drafts. Zkalf accepts it on the pull request, then its Status line says accepted."
            exit 1
          fi
          echo "No drafts."
      # Gradle's downloads stay between runs: a fresh machine took about 7 of the 11 minutes for the APK build. The key
      # is the hash of the Gradle files in app/android, so a change there starts a new cache.
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle.kts
            app/android/app/*.gradle.kts
            app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        if: steps.scope.outputs.build == 'true'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
          pub-cache-path: D:\pub-cache
      - name: Format, analyze, tests, APK build and APK check
        if: steps.scope.outputs.build == 'true'
        shell: powershell
        run: .\scripts\check.ps1 -Release
