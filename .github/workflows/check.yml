# Plan 0009 D1: the same check as on the owner's PC, on every pull request and push to main.
# The release key never comes here: the APK is debug-signed, which still proves no INTERNET and no cloud backup.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The checkout is on D:. With the pub cache on C:, Kotlin's incremental compile of plugins fails
      # ("this and base files have different roots"), so keep both on one drive.
      PUB_CACHE: D:\pub-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Build only when something check.ps1 reads changed: the app, the packages (game rules and data/*.json), the
      # scripts, the gate hook its test cases run, this workflow, or .gitattributes (line endings decide the format
      # check). Docs, design images, intent/specs/plans, evals, incidents and release notes pass in a minute.
      # A diff that can't be read builds as before. A new code folder must be added to this list.
      - name: What changed
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then base=${{ github.event.pull_request.base.sha }}; else base=${{ github.event.before }}; fi
          code='^(app/|packages/|scripts/|\.github/|\.claude/hooks/production-gate\.ps1$|\.gitattributes$)'
          if files=$(git diff --name-only "$base" HEAD) && [ -n "$files" ] && ! echo "$files" | grep -qE "$code"; then
            echo "No code changed; skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.scope.outputs.build == 'true'
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
          pub-cache-path: D:\pub-cache
      - name: Format, analyze, tests, APK build and APK check
        if: steps.scope.outputs.build == 'true'
        shell: powershell
        run: .\scripts\check.ps1 -Release
