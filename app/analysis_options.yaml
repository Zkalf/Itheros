include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - unawaited_futures
    - discarded_futures
    - avoid_dynamic_calls
    - prefer_final_locals
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - use_build_context_synchronously
