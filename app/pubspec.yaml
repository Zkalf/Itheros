name: walkingrpg
description: "Walking-powered combat RPG (Android first)."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  game_core:
    path: ../packages/game_core
  health: ^13.3.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The licences of the fonts below, shown from Settings (spec 0014 §2.2).
  # Then the images of spec 0014 §3, one folder each: Flutter does not read
  # subfolders. players/ has no portrait yet (its README says why it stays).
  assets:
    - assets/fonts/OFL-CormorantGaramond.txt
    - assets/fonts/OFL-AlegreyaSans.txt
    - assets/fonts/OFL-AlegreyaSansSC.txt
    - assets/fonts/OFL-Spectral.txt
    - assets/images/monsters/
    - assets/images/items/
    - assets/images/achievements/
    - assets/images/places/
    - assets/images/players/
    - assets/images/placeholders/
    - assets/images/pictures/
    - assets/images/spots/
    # A copy of releases/*.md, made by scripts/copy-notes.ps1 (plan 0029).
    - assets/releases/

  # Spec 0014 §2.2 and the font table of plan 0017, all SIL OFL 1.1.
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
    - family: Alegreya Sans
      fonts:
        - asset: assets/fonts/AlegreyaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/AlegreyaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/AlegreyaSans-Italic.ttf
          weight: 400
          style: italic
    - family: Alegreya Sans SC
      fonts:
        - asset: assets/fonts/AlegreyaSansSC-Bold.ttf
          weight: 700
        - asset: assets/fonts/AlegreyaSansSC-ExtraBold.ttf
          weight: 800
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Medium.ttf
          weight: 500
        - asset: assets/fonts/Spectral-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Spectral-Bold.ttf
          weight: 700
